<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>법원직 영어 실전대비 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--brand:#2f80ed;--brand2:#eef7ff;--ok:#16a34a;--bad:#dc2626;--line:#e5e7eb;--shadow:0 10px 30px rgba(15,23,42,.08);--radius:22px}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f7f7ff 0%,var(--bg) 45%,#fff 100%);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);}
.wrap{width:min(960px,100%);margin:0 auto;padding:10px 8px 24px}.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}h1{font-size:clamp(25px,6vw,42px);line-height:1.16;margin:0 0 8px;text-align:center}h2{font-size:clamp(24px,5vw,36px);margin:10px 0;text-align:center}.promoText{background:#eef7ff;border:1px solid #cfe6ff;color:#1f4f82;padding:12px 14px;border-radius:18px;margin:8px 0 12px;font-size:clamp(14px,3.7vw,21px);line-height:1.5;font-weight:800;text-align:center}.linkBtns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}.linkBtns a{display:inline-block;text-decoration:none;font-size:clamp(15px,3.7vw,20px);font-weight:900;color:white;background:#27ae60;padding:11px 18px;border-radius:999px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
video{width:min(420px,96%);border-radius:22px;background:#000;display:block;margin:8px auto 12px}.videoMissing{background:#fff5f5;color:#991b1b;border:1px solid #fecaca;border-radius:14px;padding:10px;margin:8px auto 12px;max-width:720px;display:none;font-weight:800;line-height:1.45}.topBtns,.footerBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.topBtns button,.footerBtns button,select{font:inherit;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);padding:11px 12px;font-size:clamp(14px,3.8vw,18px);font-weight:800}button{cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}button.green{background:#27ae60;color:#fff;border-color:#27ae60}button.gray{background:#777;color:#fff;border-color:#777}button.red{background:#e74c3c;color:#fff;border-color:#e74c3c}button.yellow{background:#f39c12;color:#fff;border-color:#f39c12}.mainBtn{width:min(680px,100%)}select{width:min(680px,100%)}.stat{font-size:clamp(13px,3.5vw,16px);color:var(--muted);font-weight:800;text-align:center;margin:8px 0}.bar{height:8px;background:#eef2ff;border-radius:999px;overflow:hidden;margin:10px 0}.bar>div{height:100%;width:0;background:var(--brand);transition:.25s}.speech{background:#fff4cc;padding:13px;border-radius:16px;margin:10px 0;font-size:clamp(15px,3.9vw,22px);line-height:1.45;font-weight:800;text-align:center}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:900}.concept{background:#fff8e6;border-left:6px solid #f39c12;padding:12px;border-radius:14px;margin:10px 0;text-align:left;font-size:clamp(14px,3.8vw,18px);line-height:1.55;font-weight:800}.question{font-size:clamp(17px,4.2vw,25px);line-height:1.65;font-weight:800;text-align:left;word-break:keep-all;margin:12px 0}.choices{display:grid;gap:8px}.choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;line-height:1.45;padding:11px;border:1px solid var(--line);background:#fff;border-radius:14px;font-weight:760;font-size:clamp(15px,3.8vw,19px)}.num{flex:0 0 28px;height:28px;border-radius:50%;background:#f3f4f6;display:grid;place-items:center;font-weight:900;color:#4b5563}.choice.correct{border-color:#86efac;background:#f0fdf4}.choice.correct .num{background:#dcfce7;color:#166534}.choice.wrong{border-color:#fecaca;background:#fef2f2}.choice.wrong .num{background:#fee2e2;color:#991b1b}.givenBox,.passageBox,.tipBox,.explain{margin-top:10px;padding:12px;border-radius:14px;text-align:left;font-size:clamp(14px,3.8vw,18px);line-height:1.62}.givenBox{background:#fff8e6;border:1px solid #f3c66b}.passageBox{background:#fafafa;border:1px solid var(--line)}.tipBox{background:#eef7ff;display:none}.explain{background:#f8fafc;border:1px solid var(--line);display:none}.insertMark{display:inline-block;background:#eef4ff;border:1px solid #2f80ed;color:#2f80ed;border-radius:9px;padding:1px 7px;margin:3px;font-weight:900}.wrongItem{text-align:left;background:#f7f7f7;margin:10px 0;padding:12px;border-radius:14px;line-height:1.6;font-size:clamp(13px,3.6vw,17px)}.hidden{display:none}.score{text-align:center;font-size:clamp(22px,5vw,34px);font-weight:900;margin:16px 0}.small{font-size:13px;color:var(--muted);line-height:1.45}
@media(max-width:560px){.wrap{padding:6px}.box{padding:10px;border-radius:16px}.topBtns,.footerBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}.topBtns select,.topBtns .mainBtn,.footerBtns .mainBtn{grid-column:1/-1}.choice{padding:9px}.num{flex-basis:25px;width:25px;height:25px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="box">
    <h1>법원직 영어 실전대비 퀴즈</h1>
    <div class="promoText">출제 경향이 반영된 가볍게 풀어보는 퀴즈입니다. 오류 발견 시 알려주세요.<br>여성전용고시원 스테이The머무름.</div>
    <div class="linkBtns"><a href="https://naver.me/xv3o4qD1" target="_blank" rel="noopener noreferrer">고시원 위치 보기</a></div>

    <div id="startScreen">
      <video id="mainVideo" autoplay muted loop playsinline preload="auto"><source src="teacher.mp4" type="video/mp4"></video>
      <div id="videoMissing" class="videoMissing"></div>
      <div id="speech" class="speech">문제 데이터를 불러오는 중입니다...</div>
      <div class="topBtns">
        <button class="green" onclick="turnVideoSoundOn()">영상 음성 켜기</button>
        <button class="gray" onclick="turnVideoSoundOff()">영상 음성 끄기</button>
        <select id="categorySelect" aria-label="유형 선택"><option value="전체">전체 랜덤</option></select>
        <button class="primary mainBtn" id="startBtn" onclick="startQuizFromSelect()">전체 랜덤 시작</button>
        <button class="red mainBtn" onclick="showWrongNote()">오답노트 보기</button>
        <button class="green mainBtn" onclick="startWrongQuiz()">오답만 다시 풀기</button>
      </div>
    </div>

    <div id="quizScreen" class="hidden">
      <video id="quizVideo" autoplay muted loop playsinline preload="auto"><source id="quizVideoSource" src="teacher.mp4" type="video/mp4"></video>
      <div id="quizVideoMissing" class="videoMissing"></div>
      <div id="speechBox" class="speech">문제를 읽고 가장 알맞은 답을 고르세요.</div>
      <div class="meta"><span class="badge" id="categoryText"></span><span class="badge" id="number"></span><span class="badge" id="score"></span></div>
      <div class="bar"><div id="progress"></div></div>
      <div id="conceptBox" class="concept"></div>
      <div class="question" id="question"></div>
      <div id="answerButtons" class="choices"></div>
      <div class="footerBtns">
        <button class="yellow mainBtn" onclick="toggleTip()">Tip 보기 / 숨기기</button>
        <button class="primary" id="nextBtn" onclick="nextQuestion()" disabled>다음 문제</button>
        <button class="gray" onclick="goHome()">처음으로</button>
      </div>
      <div id="tipBox" class="tipBox"></div>
      <div id="explanation" class="explain"></div>
    </div>

    <div id="finalScreen" class="hidden">
      <video id="finalVideo" autoplay muted loop playsinline preload="auto"><source src="correct.mp4" type="video/mp4"></video>
      <h2>퀴즈 완료!</h2>
      <div id="finalScore" class="score"></div>
      <p id="finalMessage"></p>
      <div class="footerBtns">
        <button class="primary" onclick="goHome()">처음으로</button>
        <button class="primary" onclick="restartSameQuiz()">다시 풀기</button>
        <button class="red mainBtn" onclick="showWrongNote()">오답노트 보기</button>
      </div>
    </div>

    <div id="wrongNoteScreen" class="hidden">
      <h2>오답노트</h2>
      <div id="wrongList"></div>
      <div class="footerBtns">
        <button class="green mainBtn" onclick="startWrongQuiz()">오답만 다시 풀기</button>
        <button class="red mainBtn" onclick="clearWrongNote()">오답노트 삭제</button>
        <button class="primary mainBtn" onclick="goHome()">처음으로</button>
      </div>
    </div>
  </section>
</div>

<script>
const VIDEO={teacher:"teacher.mp4",correct:"correct.mp4",wrong:"wrong.mp4"};
const WRONG_NOTE_KEY="courtEnglishVideoPracticalWrongNoteV2";
let quizData=[],selectedQuiz=[],currentQuestion=0,score=0,answered=false,quizMode="전체",videoSoundOn=false;

window.addEventListener("DOMContentLoaded",()=>{setupVideoErrors();loadCSVAutomatically();playMutedLoop("mainVideo",VIDEO.teacher);});

function setupVideoErrors(){
  document.querySelectorAll("video").forEach(v=>{
    v.addEventListener("error",()=>showVideoError(v));
    const s=v.querySelector("source"); if(s){s.addEventListener("error",()=>showVideoError(v));}
  });
}
function showVideoError(v){
  const msg=`영상 파일을 불러오지 못했습니다. GitHub에 ${escapeHTML(VIDEO.teacher)}, ${escapeHTML(VIDEO.correct)}, ${escapeHTML(VIDEO.wrong)} 파일이 index.html과 같은 폴더에 있는지 확인하세요.`;
  const box=v.id==="mainVideo"?document.getElementById("videoMissing"):document.getElementById("quizVideoMissing");
  if(box){box.style.display="block";box.innerHTML=msg;}
}
function setVideoSource(videoId,file){
  const v=document.getElementById(videoId); if(!v)return;
  let s=v.querySelector("source"); if(!s){s=document.createElement("source");s.type="video/mp4";v.appendChild(s);} 
  if(!s.src.endsWith(file)){s.src=file;v.load();}
}
function stopAllVideos(){document.querySelectorAll("video").forEach(v=>{try{v.pause();v.currentTime=0;}catch(e){}});}
function playMutedLoop(videoId,file){
  const v=document.getElementById(videoId); if(!v)return; setVideoSource(videoId,file); v.loop=true; v.muted=true; v.volume=0; v.currentTime=0; v.play().catch(()=>{});
}
function playOnce(videoId,file,withSound,onEnd){
  const v=document.getElementById(videoId); if(!v)return; setVideoSource(videoId,file); v.loop=false; v.muted=!withSound; v.volume=withSound?1:0; v.currentTime=0; v.onended=()=>{v.onended=null; if(onEnd)onEnd();}; v.play().catch(()=>{v.muted=true;v.volume=0;v.play().catch(()=>{});});
}
function turnVideoSoundOn(){videoSoundOn=true; playOnce("mainVideo",VIDEO.teacher,true,()=>playMutedLoop("mainVideo",VIDEO.teacher));}
function turnVideoSoundOff(){videoSoundOn=false; document.querySelectorAll("video").forEach(v=>{v.muted=true;v.volume=0;});}

function parseCSV(text){
  text=(text||"").replace(/^\uFEFF/,"");
  const rows=[]; let row=[],cur="",inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],next=text[i+1];
    if(ch==='"'&&inQuotes&&next==='"'){cur+='"';i++;continue;}
    if(ch==='"'){inQuotes=!inQuotes;continue;}
    if(ch===','&&!inQuotes){row.push(cur);cur="";continue;}
    if((ch==='\n'||ch==='\r')&&!inQuotes){ if(ch==='\r'&&next==='\n')i++; row.push(cur); rows.push(row); row=[]; cur=""; continue; }
    cur+=ch;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}
function csvToObjects(text){
  const rows=parseCSV(text); if(!rows.length)return[];
  const headers=rows.shift().map(h=>h.trim());
  return rows.map(r=>{const o={};headers.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;}).filter(q=>q.question&&q.answer);
}
function loadCSVAutomatically(){
  fetch("questions.csv?time="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("CSV 없음");return r.text();}).then(text=>{
    quizData=csvToObjects(text); setupCategories(); document.getElementById("speech").innerHTML=`문제 ${quizData.length}개를 불러왔습니다. 유형을 선택하세요.`; updateStartButton();
  }).catch(err=>{document.getElementById("speech").innerHTML="questions.csv 파일을 찾을 수 없습니다.<br>파일명과 위치를 확인하세요.";});
}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function decodeBreaks(s){return String(s??"").replace(/\\n/g,"\n").replace(/\n/g,"\n");}
function toHTMLWithBreaks(s){return escapeHTML(decodeBreaks(s)).replace(/\n/g,"<br>");}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function setupCategories(){
  const counts={}; quizData.forEach(q=>counts[q.category]=(counts[q.category]||0)+1);
  const cats=["전체",...Object.keys(counts)];
  const sel=document.getElementById("categorySelect");
  sel.innerHTML=cats.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}${c==="전체"?` (${quizData.length}문항)`: ` (${counts[c]}문항)`}</option>`).join("");
  sel.addEventListener("change",updateStartButton);
}
function updateStartButton(){const c=document.getElementById("categorySelect").value||"전체";const n=c==="전체"?quizData.length:quizData.filter(q=>q.category===c).length;document.getElementById("startBtn").textContent=`${c} 시작 (${n}문항)`;}
function startQuizFromSelect(){startQuiz(document.getElementById("categorySelect").value||"전체");}
function startQuiz(category){
  if(!quizData.length){alert("문제 데이터를 아직 불러오지 못했습니다.");return;}
  selectedQuiz=category==="전체"?[...quizData]:quizData.filter(q=>q.category===category);
  if(!selectedQuiz.length){alert("해당 유형의 문제가 없습니다.");return;}
  shuffle(selectedQuiz); quizMode=category; currentQuestion=0; score=0; answered=false;
  showScreen("quizScreen"); playMutedLoop("quizVideo",VIDEO.teacher); loadQuestion();
}
function formatQuestion(q){
  let text=decodeBreaks(q.question||"");
  if(q.category==="문장삽입형"){
    const instruction="주어진 문장이 들어가기 가장 적절한 곳을 고르시오."; const marker="[주어진 문장]"; text=text.replace(instruction,"").trim();
    let given="",passage=text;
    if(text.includes(marker)){const parts=text.split(marker); const before=parts[0].trim(); const after=parts.slice(1).join(marker).trim(); if(before){passage=before;given=after;}else{const blocks=after.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean); if(blocks.length>=2){given=blocks[0];passage=blocks.slice(1).join("\n\n");}else{const m=after.match(/\.\s+/); if(m){const end=m.index+1;given=after.slice(0,end).trim();passage=after.slice(end).trim();}else{given=after;passage="";}}}}
    passage=passage.replaceAll("( [1] )","[[MARK1]]").replaceAll("( [2] )","[[MARK2]]").replaceAll("( [3] )","[[MARK3]]").replaceAll("( [4] )","[[MARK4]]");
    let p=toHTMLWithBreaks(passage).replaceAll("[[MARK1]]","<span class='insertMark'>[1]</span>").replaceAll("[[MARK2]]","<span class='insertMark'>[2]</span>").replaceAll("[[MARK3]]","<span class='insertMark'>[3]</span>").replaceAll("[[MARK4]]","<span class='insertMark'>[4]</span>");
    return `<div><b>주어진 문장이 들어가기 가장 적절한 곳을 고르시오.</b></div>${given?`<div class='givenBox'><b>[주어진 문장]</b><br><br>${toHTMLWithBreaks(given)}</div>`:""}<div class='passageBox'>${p}</div>`;
  }
  return toHTMLWithBreaks(text).replace("고르시오.","고르시오.<br><br>").replace(/\(1\)/g,'<span class="insertMark">(1)</span>').replace(/\(2\)/g,'<span class="insertMark">(2)</span>').replace(/\(3\)/g,'<span class="insertMark">(3)</span>').replace(/\(4\)/g,'<span class="insertMark">(4)</span>');
}
function loadQuestion(){
  const q=selectedQuiz[currentQuestion]; answered=false; document.getElementById("nextBtn").disabled=true;
  document.getElementById("speechBox").textContent=q.category==="빈칸추론형"?"빈칸에 가장 알맞은 말을 고르세요.":q.category==="문장삽입형"?"문맥상 가장 자연스러운 위치를 고르세요.":q.category==="어법오류찾기"?"어법상 틀린 부분을 고르세요.":"문제를 읽고 가장 알맞은 답을 고르세요.";
  document.getElementById("categoryText").textContent="유형: "+q.category; document.getElementById("number").textContent=`문제 ${currentQuestion+1} / ${selectedQuiz.length}`; document.getElementById("score").textContent=`점수 ${score}`; document.getElementById("progress").style.width=`${(currentQuestion/selectedQuiz.length)*100}%`;
  document.getElementById("conceptBox").innerHTML=q.concept?"💡 출제 개념:<br>"+escapeHTML(q.concept):"";
  document.getElementById("question").innerHTML=formatQuestion(q); document.getElementById("tipBox").style.display="none"; document.getElementById("tipBox").innerHTML=""; document.getElementById("explanation").style.display="none"; document.getElementById("explanation").innerHTML="";
  const area=document.getElementById("answerButtons"); area.innerHTML=[1,2,3,4].map(i=>`<button class="choice" data-choice="${i}" onclick="checkAnswer('${i}')"><span class="num">${i}</span><span>${escapeHTML(q['choice'+i])}</span></button>`).join("");
}
function checkAnswer(ans){
  if(answered)return; answered=true; const q=selectedQuiz[currentQuestion]; const isCorrect=String(ans)===String(q.answer); if(isCorrect)score++; else saveWrongQuestion(q);
  document.querySelectorAll(".choice").forEach(b=>{b.disabled=true; if(b.dataset.choice===String(q.answer))b.classList.add("correct"); if(b.dataset.choice===String(ans)&&!isCorrect)b.classList.add("wrong");});
  playOnce("quizVideo",isCorrect?VIDEO.correct:VIDEO.wrong,videoSoundOn,()=>playMutedLoop("quizVideo",VIDEO.teacher));
  const correctText=q['choice'+q.answer]||""; const ex=document.getElementById("explanation"); ex.style.display="block"; ex.innerHTML=`<strong style="color:${isCorrect?'var(--ok)':'var(--bad)'}">${isCorrect?'정답입니다!':'오답입니다.'}</strong><br><strong>정답:</strong> ${escapeHTML(q.answer)}. ${escapeHTML(correctText)}<br><br><strong>해설:</strong> ${escapeHTML(q.explanation)}`;
  if(quizMode==="오답노트"&&isCorrect)removeFromWrongNote(q); document.getElementById("score").textContent=`점수 ${score}`; document.getElementById("nextBtn").disabled=false;
}
function toggleTip(){const box=document.getElementById("tipBox");const q=selectedQuiz[currentQuestion]; if(box.style.display==="block"){box.style.display="none";return;} box.style.display="block"; box.innerHTML=`<b>시험식 힌트</b><br>${escapeHTML(q.hint||"힌트가 입력되지 않았습니다.")}<br><br><b>문장 전체 해석</b><br>${escapeHTML(q.translation||"해석이 입력되지 않았습니다.")}<br><br><b>핵심 정답 표현</b><br>${escapeHTML(q['choice'+q.answer]||"")}`;}
function nextQuestion(){if(!answered){alert("먼저 답을 선택하세요.");return;} if(currentQuestion>=selectedQuiz.length-1){showFinalScreen();return;} currentQuestion++; loadQuestion();}
function showFinalScreen(){document.getElementById("progress").style.width="100%"; showScreen("finalScreen"); playMutedLoop("finalVideo",VIDEO.correct); const pct=Math.round(score/selectedQuiz.length*100); document.getElementById("finalScore").textContent=`최종 점수: ${score} / ${selectedQuiz.length} (${pct}%)`; document.getElementById("finalMessage").textContent=pct>=90?"매우 좋습니다. 핵심 구문과 독해 흐름을 안정적으로 이해하고 있습니다.":pct>=70?"좋습니다. 오답노트를 반복하면 더 좋아집니다.":"오답노트를 중심으로 다시 반복하는 것이 좋습니다.";}
function restartSameQuiz(){shuffle(selectedQuiz);currentQuestion=0;score=0;answered=false;showScreen("quizScreen");playMutedLoop("quizVideo",VIDEO.teacher);loadQuestion();}
function saveWrongQuestion(q){let wrong=JSON.parse(localStorage.getItem(WRONG_NOTE_KEY)||"[]"); if(!wrong.some(x=>x.question===q.question)){wrong.push(q); localStorage.setItem(WRONG_NOTE_KEY,JSON.stringify(wrong));}}
function removeFromWrongNote(q){let wrong=JSON.parse(localStorage.getItem(WRONG_NOTE_KEY)||"[]"); wrong=wrong.filter(x=>x.question!==q.question); localStorage.setItem(WRONG_NOTE_KEY,JSON.stringify(wrong));}
function startWrongQuiz(){const wrong=JSON.parse(localStorage.getItem(WRONG_NOTE_KEY)||"[]"); if(!wrong.length){alert("저장된 오답이 없습니다.");return;} selectedQuiz=shuffle([...wrong]);quizMode="오답노트";currentQuestion=0;score=0;answered=false;showScreen("quizScreen");playMutedLoop("quizVideo",VIDEO.teacher);loadQuestion();}
function showWrongNote(){showScreen("wrongNoteScreen"); const wrong=JSON.parse(localStorage.getItem(WRONG_NOTE_KEY)||"[]"); let html=""; if(!wrong.length){html="<p>아직 저장된 오답이 없습니다.</p>";} else {wrong.forEach((q,i)=>{html+=`<div class='wrongItem'><b>${i+1}. [${escapeHTML(q.category)}]</b><br>${q.concept?`<b>💡 출제 개념:</b><br>${escapeHTML(q.concept)}<br><br>`:""}${formatQuestion(q)}<br><br>1. ${escapeHTML(q.choice1)}<br>2. ${escapeHTML(q.choice2)}<br>3. ${escapeHTML(q.choice3)}<br>4. ${escapeHTML(q.choice4)}<br><b>정답: ${escapeHTML(q.answer)}</b><br>${escapeHTML(q.explanation)}<br><br><b>해석:</b><br>${escapeHTML(q.translation||"")}<br><br><b>힌트:</b><br>${escapeHTML(q.hint||"")}</div>`;});} document.getElementById("wrongList").innerHTML=html;}
function clearWrongNote(){if(confirm("오답노트를 모두 삭제할까요?")){localStorage.removeItem(WRONG_NOTE_KEY);showWrongNote();}}
function showScreen(id){["startScreen","quizScreen","finalScreen","wrongNoteScreen"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");stopAllVideos(); if(id==="startScreen")playMutedLoop("mainVideo",VIDEO.teacher);}
function goHome(){showScreen("startScreen"); updateStartButton();}
</script>
